# Modelos padrão por CLI. Formato: <alvo>.<tier>=<id do modelo>
# Alvos: claude codex cursor gemini opencode cline goose aider generic | default (vale para todos)
# Tiers: primary = o mais poderoso (fases de review); secondary = fases de autoria.
# Sem valor para um alvo → os agents herdam o modelo da sessão.
# Não edite para uso pessoal: use scripts/dummy-models, que grava em ~/.config/dummy/models.conf.
claude.primary=claude-fable-5-2
claude.secondary=claude-opus-4-8
